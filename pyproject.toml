[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages", "apps"]
testpaths = ["apps/api/tests"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
