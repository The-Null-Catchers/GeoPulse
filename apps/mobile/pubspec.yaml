name: geopulse
version: 0.1.0+1
publish_to: none
description: GeoPulse operator and consent-based location tracker
# Platform folders must be generated with the checked-in bootstrap script.
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
flutter:
  uses-material-design: true
